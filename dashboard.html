{% extends "layout.html" %}

{% block title %}Dashboard - AIview{% endblock %}

{% block content %}

<div class="dashboard-page">

    <h2 class="dash-title">Dashboard</h2>

    <!-- Top Metrics -->
    <div class="metric-row">

        <div class="metric-card" style="background:#dbeafe;">
            <h3>Total Interviews</h3>
            <p class="metric-value">{{ total_interviews }}</p>
        </div>

        <div class="metric-card" style="background:#dcfce7;">
            <h3>Average Score</h3>
            <p class="metric-value">{{ average_score }}</p>
        </div>

        <div class="metric-card" style="background:#fef9c3;">
            <h3>Success Rate</h3>
            <p class="metric-value">{{ success_rate }}%</p>
        </div>

        <div class="metric-card" style="background:#fde2e4;">
            <h3>Last Interview</h3>
            <p class="metric-value">{{ last_interview }}</p>
        </div>

    </div>

    <!-- Performance Trends -->
    <h3 class="section-title">Performance Trends</h3>

    <div class="chart-container">
        <canvas id="trendLine"></canvas>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {

    const ctx = document.getElementById("trendLine");

    const labels = {{ labels|tojson }};
    const scores = {{ scores|tojson }};

    if (!ctx) return;

    new Chart(ctx, {
        type: "line",
        data: {
        labels: labels,
        datasets: [{
            label: "Score (Last 10 Interviews)",
            data: scores,
            borderColor: "#3b82f6",
            backgroundColor: "rgba(59,130,246,0.1)",
            tension: 0.3,
            fill: true
        }]
        },
        options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
            y: {
            min: 0,
            max: 100
            }
        }
        }
    });

    });
    </script>

</div>

{% endblock %}
